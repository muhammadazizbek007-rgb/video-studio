# Co-tenant deployment for a VPS that is ALREADY running other services.
#
# 173.249.47.179 serves api.umbra.uz from an nginx installed on the host, which owns
# ports 80 and 443. docker-compose.prod.yml would try to bind those itself and either
# fail to start or take the port from the running site — so this file is used instead.
#
# Differences from docker-compose.prod.yml:
#   - no nginx service; the HOST nginx terminates TLS and proxies to these containers
#   - every published port is bound to 127.0.0.1, so nothing here is reachable from the
#     internet except through that nginx
#   - the ports are unusual on purpose, to avoid colliding with whatever else is running
#
#   docker compose -f docker-compose.vps.yml up -d

name: video-studio

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  mongo:
    image: mongo:${MONGO_TAG:-7}
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - data
    logging: *logging

  api:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set}/video-studio-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../shared/env/api.env
    environment:
      NODE_ENV: production
      PORT: '8080'
      MEDIA_ROOT: /app/var/media
    volumes:
      - media:/app/var/media
    ports:
      - '127.0.0.1:${API_BIND_PORT:-8090}:8080'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/api/health/ready']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - data
    logging: *logging

  web:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set}/video-studio-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_BIND_PORT:-8091}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *logging

volumes:
  mongo-data:
  mongo-config:
  media:

networks:
  data:
    internal: true
