# gadgetpro.uz — single-origin deployment.
#
# The SPA and the API share one origin: nginx serves the static bundle at / and
# proxies /api, /mcp and /media to the api container. That makes CORS irrelevant
# (every request is same-origin, so CORS_ORIGINS stays empty) and lets the session
# cookies work with no cross-site considerations at all.
#
# www redirects to the apex rather than being served in parallel — two live origins
# would split the session cookie, since it is host-only.
#
# A NAMED server_name beats the `_` default_server in app.conf, which stays as the
# catch-all answering a bare IP or a stale record with the placeholder certificate.
#
# Certificates come from scripts/issue-certs.sh:
#   sudo DOMAINS='gadgetpro.uz www.gadgetpro.uz' \
#     /opt/video-studio/current/scripts/issue-certs.sh you@example.com

server {
  listen      80;
  listen      [::]:80;
  server_name gadgetpro.uz www.gadgetpro.uz;

  # Above the redirect: http-01 is fetched over plain HTTP, and a 301 towards a
  # certificate that does not exist yet would fail the issuance meant to fix it.
  location ^~ /.well-known/acme-challenge/ {
    root         /var/www/certbot;
    default_type text/plain;
    access_log   off;
  }

  location = /healthz {
    access_log   off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://gadgetpro.uz$request_uri;
  }
}

# www over TLS exists only to redirect. It still needs a certificate, which is why
# issue-certs.sh is given both names.
server {
  listen      443 ssl;
  listen      [::]:443 ssl;
  http2       on;
  server_name www.gadgetpro.uz;

  ssl_certificate     /etc/nginx/certs/gadgetpro.uz/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/gadgetpro.uz/privkey.pem;

  return 301 https://gadgetpro.uz$request_uri;
}

server {
  listen      443 ssl;
  listen      [::]:443 ssl;
  http2       on;
  server_name gadgetpro.uz;

  ssl_certificate     /etc/nginx/certs/gadgetpro.uz/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/gadgetpro.uz/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "DENY" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Everything is same-origin, so connect-src 'self' covers the API. The one external
  # host is lh3.googleusercontent.com, which serves Google profile avatars after
  # sign-in. style-src keeps 'unsafe-inline' because React and motion write animated
  # values into the style attribute, which CSP counts as inline style. blob: on
  # img/media is for local previews and the stitched export.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

  # Reference images and last frames. The API enforces its own smaller per-file cap.
  client_max_body_size 12m;

  set $api_upstream http://api:8080;
  set $web_upstream http://web:80;

  location = /healthz {
    access_log   off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # nginx matches regex locations ahead of prefix ones, so this wins over /api/
  # regardless of order — but keeping it first keeps the intent readable. Buffering an
  # SSE response holds every status frame until the stream ends, which defeats the
  # endpoint entirely.
  location ~ ^/api/generations/[^/]+/events/?$ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        '';
    proxy_set_header Accept-Encoding   '';

    proxy_buffering           off;
    proxy_request_buffering   off;
    proxy_cache               off;
    chunked_transfer_encoding off;
    gzip                      off;
    proxy_read_timeout        3600s;
    proxy_send_timeout        3600s;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_connect_timeout 10s;
    # Starting a Veo operation and enriching a prompt are both slow upstream calls.
    proxy_read_timeout    180s;
    proxy_send_timeout    180s;
  }

  # MCP StreamableHTTP holds a response open exactly like SSE does.
  location /mcp {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        '';
    proxy_set_header Accept-Encoding   '';

    proxy_buffering           off;
    proxy_request_buffering   off;
    proxy_cache               off;
    chunked_transfer_encoding off;
    gzip                      off;
    proxy_read_timeout        3600s;
    proxy_send_timeout        3600s;
  }

  # Generated videos and uploads. Every object is named with a uuid and never
  # rewritten, so it can be cached hard. `expires` adds Cache-Control without
  # dropping the inherited add_header set the way a nested add_header would.
  location /media/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 120s;
    expires 30d;
  }

  location / {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
  }
}
