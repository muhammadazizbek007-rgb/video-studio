# studio.haywan.uz — the SPA.
#
# A NAMED server block beats the `_` default_server in app.conf for this Host, so
# app.conf stays as the catch-all that answers anything else (a bare IP, a stale
# DNS record, a scanner) with the placeholder certificate.
#
# /media/ is proxied here as well as on the API host, deliberately. The API returns
# media as the relative path `/media/<uuid>`, which the browser resolves against the
# page origin — this one. Keeping it same-origin also keeps the canvas untainted in
# lib/stitchSegments.ts, which draws generated clips into a MediaRecorder.
#
# Certificates come from scripts/issue-certs.sh: a self-signed placeholder first so
# nginx can boot, replaced by symlinks into /etc/letsencrypt once ACME succeeds.

server {
  listen      80;
  listen      [::]:80;
  server_name studio.haywan.uz;

  # Above the redirect: http-01 is fetched over plain HTTP, and a 301 towards a
  # certificate that does not exist yet would fail the issuance meant to fix it.
  location ^~ /.well-known/acme-challenge/ {
    root         /var/www/certbot;
    default_type text/plain;
    access_log   off;
  }

  location = /healthz {
    access_log   off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen      443 ssl;
  listen      [::]:443 ssl;
  http2       on;
  server_name studio.haywan.uz;

  ssl_certificate     /etc/nginx/certs/studio.haywan.uz/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/studio.haywan.uz/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "DENY" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

  # connect-src has to name the API host explicitly: the document origin is
  # studio.haywan.uz but every XHR goes to studio-api.haywan.uz, which 'self' does
  # not cover. img-src allows lh3.googleusercontent.com for Google profile avatars.
  # blob: on img/media is for local previews and the stitched export.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://studio-api.haywan.uz; worker-src 'self' blob:; manifest-src 'self'" always;

  set $api_upstream http://api:8080;
  set $web_upstream http://web:80;

  location = /healthz {
    access_log   off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Generated videos and uploads. Every object is named with a uuid and never
  # rewritten, so it can be cached hard. `expires` adds Cache-Control without
  # dropping the inherited add_header set the way a nested add_header would.
  location /media/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 120s;
    expires 30d;
  }

  location / {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
  }
}
