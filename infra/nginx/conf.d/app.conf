# Edge reverse proxy.
#
#   /                        -> web container (static SPA)
#   /api, /media             -> api container
#   /api/generations/*/events-> api container, unbuffered (SSE)
#   /mcp                     -> api container, unbuffered (MCP StreamableHTTP)
#
# server_name is `_` on purpose: the deployment is single-tenant and every redirect
# is built from $host, so the same file works for any domain without templating.

server {
  listen      80 default_server;
  listen      [::]:80 default_server;
  server_name _;

  # Must stay ABOVE the redirect: certbot's http-01 challenge is fetched over plain
  # HTTP and a 301 to a not-yet-valid certificate would fail the very issuance that
  # is meant to fix it.
  location ^~ /.well-known/acme-challenge/ {
    root         /var/www/certbot;
    default_type text/plain;
    access_log   off;
  }

  location = /healthz {
    access_log   off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen      443 ssl default_server;
  listen      [::]:443 ssl default_server;
  http2       on;
  server_name _;

  # These two paths always exist: provisioning drops a self-signed placeholder there
  # so nginx starts on a box that has never seen certbot. After issuing a real
  # certificate, point them at Let's Encrypt (both paths exist inside the container):
  #
  #   sudo certbot certonly --webroot -w /opt/video-studio/shared/certbot/www \
  #     -d example.com -m you@example.com --agree-tos --no-eff-email
  #   ln -sfn /etc/letsencrypt/live/example.com/fullchain.pem \
  #     /opt/video-studio/shared/certs/fullchain.pem
  #   ln -sfn /etc/letsencrypt/live/example.com/privkey.pem \
  #     /opt/video-studio/shared/certs/privkey.pem
  #   docker compose -f /opt/video-studio/current/docker-compose.prod.yml \
  #     exec nginx nginx -s reload
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "DENY" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

  # No CDN, no web fonts, no third-party analytics — everything this app loads is
  # same-origin. style-src keeps 'unsafe-inline' because React and motion write
  # animated values into the style attribute, which CSP treats as inline style.
  # blob: is required for img/media: previews and generated videos are played from
  # object URLs before they are persisted.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

  set $api_upstream http://api:8080;
  set $web_upstream http://web:80;

  location = /healthz {
    access_log   off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Regex locations win over the /api/ prefix below, so this must stay the only
  # rule matching the event stream. Buffering an SSE response makes the live
  # generation status arrive in one lump at the end, which is worse than useless.
  location ~ ^/api/generations/[^/]+/events/?$ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        '';
    proxy_set_header Accept-Encoding   '';

    proxy_buffering           off;
    proxy_request_buffering   off;
    proxy_cache               off;
    chunked_transfer_encoding off;
    gzip                      off;
    proxy_read_timeout        3600s;
    proxy_send_timeout        3600s;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_connect_timeout 10s;
    # Starting a Veo operation and enriching a prompt are both slow upstream calls.
    proxy_read_timeout    180s;
    proxy_send_timeout    180s;
  }

  # MCP StreamableHTTP keeps a long-lived response open exactly like SSE does.
  location /mcp {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        '';
    proxy_set_header Accept-Encoding   '';

    proxy_buffering           off;
    proxy_request_buffering   off;
    proxy_cache               off;
    chunked_transfer_encoding off;
    gzip                      off;
    proxy_read_timeout        3600s;
    proxy_send_timeout        3600s;
  }

  # Generated videos and uploads. Content is immutable once written — the storage
  # driver names every object with a uuid — so it can be cached hard.
  location /media/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 120s;
    # `expires` does not reset the inherited add_header set the way a nested
    # add_header would, so the security headers above still apply here.
    expires 30d;
  }

  location / {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
  }
}
