# studio-api.haywan.uz — the API, MCP endpoint and media.
#
# studio.haywan.uz and studio-api.haywan.uz share the registrable domain haywan.uz,
# so they are same-SITE but not same-ORIGIN. That distinction is the whole design:
#
#   - the session cookies are SameSite=Lax and host-only, and a same-site request
#     carries them, so the SPA's fetch(credentials: 'include') is authenticated;
#   - the request is still cross-origin, so CORS must echo one specific origin and
#     allow credentials. A wildcard is invalid with cookies. That is what
#     CORS_ORIGINS=https://studio.haywan.uz in shared/env/api.env is for.
#
# The Google OAuth client's authorised redirect URI must be exactly
#   https://studio-api.haywan.uz/api/auth/google/callback

server {
  listen      80;
  listen      [::]:80;
  server_name studio-api.haywan.uz;

  location ^~ /.well-known/acme-challenge/ {
    root         /var/www/certbot;
    default_type text/plain;
    access_log   off;
  }

  location = /healthz {
    access_log   off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen      443 ssl;
  listen      [::]:443 ssl;
  http2       on;
  server_name studio-api.haywan.uz;

  ssl_certificate     /etc/nginx/certs/studio-api.haywan.uz/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/studio-api.haywan.uz/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  # This host serves JSON, media bytes and one OAuth redirect — never a document
  # that should end up in a frame.
  add_header X-Frame-Options           "DENY" always;

  # Reference images and last frames. The API enforces its own smaller per-file cap.
  client_max_body_size 12m;

  set $api_upstream http://api:8080;

  location = /healthz {
    access_log   off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # nginx matches regex locations ahead of prefix ones, so this wins over /api/
  # regardless of order — but keeping it first keeps the intent readable. Buffering
  # an SSE response holds every status frame until the stream ends, which defeats
  # the endpoint entirely.
  location ~ ^/api/generations/[^/]+/events/?$ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        '';
    proxy_set_header Accept-Encoding   '';

    proxy_buffering           off;
    proxy_request_buffering   off;
    proxy_cache               off;
    chunked_transfer_encoding off;
    gzip                      off;
    proxy_read_timeout        3600s;
    proxy_send_timeout        3600s;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_connect_timeout 10s;
    # Starting a Veo operation and enriching a prompt are both slow upstream calls.
    proxy_read_timeout    180s;
    proxy_send_timeout    180s;
  }

  # MCP StreamableHTTP holds a response open exactly like SSE does.
  location /mcp {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        '';
    proxy_set_header Accept-Encoding   '';

    proxy_buffering           off;
    proxy_request_buffering   off;
    proxy_cache               off;
    chunked_transfer_encoding off;
    gzip                      off;
    proxy_read_timeout        3600s;
    proxy_send_timeout        3600s;
  }

  # Also served here so MCP clients — which are not on this host and get absolute
  # URLs built from API_PUBLIC_URL — can actually fetch a generated video.
  location /media/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 120s;
    expires 30d;
  }

  # Nothing else is public on this host. 404 rather than proxying: an unmatched path
  # reaching Fastify is a routing mistake, and it should look like one.
  location / {
    access_log off;
    return 404;
  }
}
