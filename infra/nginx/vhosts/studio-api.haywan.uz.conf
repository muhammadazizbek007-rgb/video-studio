# API vhost for the HOST nginx on 173.249.47.179. Adds a server block alongside the
# existing api.umbra.uz site; it must not replace or edit that one.
#
#   sudo cp studio-api.haywan.uz.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate (with only the :80 server present):
#   sudo certbot certonly --webroot -w /var/www/certbot -d studio-api.haywan.uz
#
# studio.haywan.uz and studio-api.haywan.uz share the registrable domain haywan.uz, so
# they are same-site: the SameSite=Lax session cookies set here are sent on requests the
# frontend makes. What they are NOT is same-origin, which is why CORS below must echo a
# specific origin and allow credentials — a wildcard is invalid with cookies.

server {
    listen 80;
    listen [::]:80;
    server_name studio-api.haywan.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name studio-api.haywan.uz;

    ssl_certificate     /etc/letsencrypt/live/studio-api.haywan.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio-api.haywan.uz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Reference images and generated video; the API caps uploads at 10 MB itself.
    client_max_body_size 12m;

    # Server-Sent Events. This location must come before the generic /api/ block —
    # nginx matches regex locations ahead of prefix ones, but keeping it first also
    # keeps the intent obvious. Buffering here would hold every status frame until the
    # stream ended, which is the whole point of the endpoint.
    location ~ ^/api/generations/[^/]+/events/?$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_buffering           off;
        proxy_cache               off;
        chunked_transfer_encoding off;
        proxy_read_timeout        3600s;
        proxy_send_timeout        3600s;
    }

    # MCP streams too.
    location /mcp {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Veo generations are polled, not held open, but the first call to Vertex can be slow.
        proxy_read_timeout 180s;
    }
}
