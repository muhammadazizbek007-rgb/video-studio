# Frontend vhost for the HOST nginx on 173.249.47.179.
#
# This box already serves api.umbra.uz. This file ADDS a server block; it must never
# replace nginx.conf or touch the existing site. Install with:
#
#   sudo cp studio.haywan.uz.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate (run BEFORE enabling the ssl block below, with only the :80 server present):
#   sudo certbot certonly --webroot -w /var/www/certbot -d studio.haywan.uz

server {
    listen 80;
    listen [::]:80;
    server_name studio.haywan.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name studio.haywan.uz;

    ssl_certificate     /etc/letsencrypt/live/studio.haywan.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.haywan.uz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    # connect-src has to name the API host explicitly: the SPA is served from
    # studio.haywan.uz but every request goes to studio-api.haywan.uz, which 'self'
    # does not cover. media-src blob: is what lets the player show generated video.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com; media-src 'self' blob: https://studio-api.haywan.uz; font-src 'self'; connect-src 'self' https://studio-api.haywan.uz; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
