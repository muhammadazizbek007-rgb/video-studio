user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  2048;
  multi_accept        on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time urt="$upstream_response_time"';
  access_log /var/log/nginx/access.log main;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  server_tokens off;

  keepalive_timeout   65;
  types_hash_max_size 2048;

  # Reference images and last-frame stills are posted to /api/media/upload; the API
  # caps individual files well below this, the limit is only here to stop nginx from
  # rejecting a legitimate upload with a 413 before it ever reaches Fastify.
  client_max_body_size 12m;
  client_body_timeout  60s;
  client_header_timeout 30s;
  send_timeout          60s;

  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   5;
  gzip_min_length   1024;
  gzip_types        application/javascript
                    application/json
                    application/manifest+json
                    application/wasm
                    application/xml
                    image/svg+xml
                    text/css
                    text/javascript
                    text/plain
                    text/xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker's embedded DNS. Combined with variables in proxy_pass this makes nginx
  # re-resolve the api/web service names, so a container that comes back on a new
  # IP after `docker compose up -d` does not strand the proxy on a stale address.
  resolver 127.0.0.11 valid=15s ipv6=off;
  resolver_timeout 5s;

  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1d;
  ssl_session_tickets       off;

  include /etc/nginx/conf.d/*.conf;
}
